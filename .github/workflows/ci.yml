name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - run: npm install -g pnpm@12.15.0
      - run: ./scripts/fetch-runtime.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:boundaries
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e --project=chrome
